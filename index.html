<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polyomino Playground</title>
<style>
  :root {
    --bg: #241f1c;
    --panel: #332a25;
    --panel-border: #4d3f36;
    --board-cell: #443830;
    --text: #e8ddd0;
    --text-dim: #a3937f;
    --accent: #d99a4e;
    --accent-dim: #8a6b3e;
    --valid-bg: #3c5638;
    --valid-border: #6fae5a;
    --invalid-bg: #5a3838;
    --invalid-border: #c25a5a;
    --danger: #a34a4a;
    --teal: #4f8a8b;
    --plum: #7d5a78;
    --edit-color: #5a7d8c;
    --checker-0: #2e2622;
    --checker-1: #5e4c3e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    padding: 10px 14px;
    gap: 8px;
  }

  .topbar { flex: 0 0 auto; display: flex; align-items: baseline; gap: 8px; }
  .topbar .logo { color: var(--accent); font-size: 1.1rem; }
  .topbar .title { font-size: 1.05rem; font-weight: 700; letter-spacing: 1px; color: var(--accent); }

  .main-row {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: row;
    gap: 14px;
    align-items: stretch;
    justify-content: center;
  }

  /* ── SIDEBAR / PALETTE ── */
  .sidebar {
    flex: 0 0 320px;
    overflow-y: auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 12px;
  }

  .row { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--text-dim); }
  .row input[type=number] {
    width: 48px;
    padding: 4px 6px;
    border-radius: 6px;
    border: 1px solid var(--panel-border);
    background: var(--board-cell);
    color: var(--text);
  }
  .row input[type=checkbox] { accent-color: var(--accent); cursor: pointer; }
  .row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

  .tray-controls-row { padding-bottom: 10px; border-bottom: 1px solid var(--panel-border); }

  button {
    padding: 6px 11px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.76rem;
    font-weight: 600;
    color: #fff;
    transition: opacity 0.15s, transform 0.1s;
  }
  button:hover { opacity: 0.85; transform: translateY(-1px); }
  button:active { transform: translateY(0); }

  .btn-mini   { background: var(--teal); padding: 5px 10px; }
  .btn-mini.active { box-shadow: 0 0 0 2px var(--accent); }
  .btn-clear  { background: var(--panel-border); color: var(--text); }
  .btn-trash  { background: var(--danger); }
  .btn-save   { background: var(--plum); }
  /* Rotate is always teal, flip/reflect is always plum, wherever they appear */
  .btn-rotate { background: var(--teal); }
  .btn-flip   { background: var(--plum); }

  .palette-section.collapsed .palette-tiles { display: none; }
  .palette-section.collapsed .chevron { transform: rotate(-90deg); }

  .section-header {
    font-size: 0.82rem;
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
    padding: 2px 0;
  }
  .section-header .chevron { transition: transform 0.15s; font-size: 0.7rem; }

  .palette-tiles {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }

  .tile {
    position: relative;
    background: var(--board-cell);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: grab;
    user-select: none;
    touch-action: none;
    transition: box-shadow 0.15s, transform 0.15s;
    min-width: 52px;
  }
  .tile:hover { box-shadow: 0 0 8px #d99a4e55; transform: translateY(-2px); }
  .tile:active { cursor: grabbing; }
  .tile .tile-name { font-size: 0.6rem; color: var(--text-dim); text-align: center; white-space: nowrap; }
  .tile .tile-grid { position: relative; }

  .tile-btn {
    position: absolute;
    top: -6px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: none;
    font-size: 9px;
    line-height: 16px;
    text-align: center;
    cursor: pointer;
    color: #fff;
    display: none;
  }
  .tile:hover .tile-btn { display: block; }
  /* positions only here — colors come from the shared .btn-rotate/.btn-flip
     rules plus these two, so every rotate/flip button app-wide matches */
  .tile-btn.edit   { right: -6px; background: var(--edit-color); }
  .tile-btn.del    { right: 18px; background: var(--danger); }
  .tile-btn.flip   { right: 42px; }
  .tile-btn.rotate { right: 66px; }
  /* standard/pentomino tiles only ever show rotate+flip (no edit/del),
     so they get the first two slots instead of the crowded 4-button layout */
  .tile-btn.flip.pair   { right: -6px; }
  .tile-btn.rotate.pair { right: 18px; }

  .add-tile {
    background: var(--board-cell);
    border: 1px dashed var(--accent-dim);
    border-radius: 8px;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 52px;
    min-height: 52px;
    cursor: pointer;
    color: var(--accent-dim);
    font-size: 1.3rem;
  }
  .add-tile:hover { background: #4d4038; color: var(--accent); }

  /* ── BOARD ── */
  .board-area {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    min-height: 0;
    overflow: auto;
  }

  .trash-zone {
    width: 100%;
    max-width: 480px;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 2px dashed var(--danger);
    border-radius: 10px;
    background: rgba(163,74,74,0.08);
    color: var(--danger);
    font-size: 0.8rem;
    font-weight: 600;
    transition: background 0.15s, border-color 0.15s, transform 0.15s;
  }
  .trash-zone .trash-icon { font-size: 1.1rem; }
  .trash-zone.drag-over {
    background: rgba(163,74,74,0.35);
    border-color: #ff8080;
    border-style: solid;
    transform: scale(1.03);
  }

  .error-toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--danger);
    color: #fff;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 3000;
  }
  .error-toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

  #marquee-box {
    position: fixed;
    display: none;
    border: 1px dashed rgba(255,255,255,0.85);
    background: rgba(255,255,255,0.08);
    pointer-events: none;
    z-index: 1500;
  }

  #board-outer {
    position: relative;
    background: #1c1714;
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 0 24px rgba(0,0,0,0.5);
  }

  #board { position: relative; display: grid; }

  .board-cell {
    background: var(--board-cell);
    border: 1px solid var(--panel-border);
    border-radius: 3px;
  }
  /* Pattern classes (checkerboard today, more groups later) come before the
     drag-highlight rules below so hl-valid/hl-invalid still win when both
     apply to the same cell during a drag. */
  .board-cell.pat0 { background: var(--checker-0); }
  .board-cell.pat1 { background: var(--checker-1); }
  .board-cell.hl-valid { background: var(--valid-bg); border-color: var(--valid-border); }
  .board-cell.hl-invalid { background: var(--invalid-bg); border-color: var(--invalid-border); }

  #pieces-layer { position: absolute; inset: 10px; pointer-events: none; }
  /* Sits above pieces-layer so the pattern shows through ("onion skin")
     even over covered squares; never intercepts clicks/drags. */
  #checker-overlay { position: absolute; inset: 10px; pointer-events: none; }
  .checker-overlay-cell { position: absolute; opacity: 0.5; border-radius: 3px; }

  .placed-piece { position: absolute; }
  .placed-piece .blk {
    pointer-events: auto;
    cursor: grab;
  }
  .placed-piece .piece-svg { filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4)); }
  .placed-piece.selected .piece-svg {
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4)) drop-shadow(0 0 2px rgba(255,255,255,0.75));
  }
  /* Comes after .selected so it wins when a piece is both selected and
     invalid — which is the common case, since the piece needing fixing
     stays selected until it's resolved. */
  .placed-piece.invalid .piece-svg {
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4)) drop-shadow(0 0 4px rgba(220,70,70,0.95)) drop-shadow(0 0 4px rgba(220,70,70,0.95));
  }

  .ghost {
    position: absolute;
    pointer-events: none;
    opacity: 0.7;
    z-index: 999;
    transition: left 0.05s linear, top 0.05s linear;
  }
  .ghost.invalid .piece-svg { filter: grayscale(0.5) brightness(0.7); }
  .ghost.trashing { opacity: 0.35; transform: scale(0.6); transition: left 0.05s linear, top 0.05s linear, opacity 0.15s, transform 0.15s; }

  .sel-toolbar {
    position: fixed;
    display: flex;
    gap: 4px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 4px;
    z-index: 1000;
  }
  .sel-toolbar button { padding: 5px 8px; font-size: 0.68rem; }

  .info-bar { font-size: 0.76rem; color: var(--text-dim); text-align: center; }
  .info-bar b { color: var(--accent); }

  .hint { color: #7a6c5e; font-size: 0.68rem; text-align: center; }

  /* ── EDITOR MODAL ── */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center; z-index: 2000;
  }
  .modal-backdrop.hidden { display: none; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 18px;
    width: 340px;
    max-width: 92vw;
  }
  .modal h2 { color: var(--accent); font-size: 0.95rem; margin-bottom: 12px; }
  .editor-label { font-size: 0.72rem; color: var(--text-dim); margin: 8px 0 6px; }
  #editor-grid { display: grid; gap: 2px; margin-bottom: 4px; }
  .editor-cell { width: 26px; height: 26px; background: var(--board-cell); border-radius: 4px; cursor: pointer; }
  .name-input {
    width: 100%; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--panel-border); background: var(--board-cell); color: var(--text); font-size: 0.78rem;
  }
  .color-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .color-swatch { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  .color-swatch.active { border-color: #fff; }
  .color-custom-input { width: 28px; height: 22px; border: none; background: none; cursor: pointer; }
  .modal-btn-row { display: flex; gap: 8px; margin-top: 14px; }
  .modal-btn-row button { flex: 1; }
</style>
</head>
<body>

<div class="topbar"><span class="logo">&#9670;</span><span class="title">Polyominoes</span></div>
<div id="error-toast" class="error-toast"></div>
<div id="marquee-box"></div>

<div class="main-row">

  <div class="board-area">
    <div id="trash-zone" class="trash-zone">
      <span class="trash-icon">&#128465;</span>
      <span>Drag piece here to delete</span>
    </div>
    <div id="board-outer">
      <div id="board"></div>
      <div id="pieces-layer"></div>
      <div id="checker-overlay"></div>
    </div>
    <div class="info-bar">Open: <b id="holes-count">64</b>/<span id="total-count">64</span></div>
    <div class="info-bar" id="checker-counts" style="display:none;"></div>
    <button class="btn-trash" id="clear-board-btn">
      <svg width="12" height="12" viewBox="0 0 14 14" style="vertical-align:middle;margin-right:6px;" fill="none">
        <rect x="0" y="0" width="6" height="6" fill="currentColor"/>
        <rect x="8" y="0" width="6" height="6" fill="currentColor"/>
        <rect x="0" y="8" width="6" height="6" fill="currentColor"/>
        <rect x="8" y="8" width="6" height="6" fill="currentColor"/>
      </svg>Clear entire grid
    </button>
    <p class="hint">Drag to place &bull; click to select (+shift for multiple) &bull; arrows/R/T/D/Del/Z</p>
  </div>

  <div class="sidebar">
    <div class="row">
      Grid
      <input type="number" id="grid-size-input" min="4" max="20" value="8">
    </div>
    <div class="row" id="grid-size-error" style="display:none; color: var(--invalid-border); font-size:0.7rem;">
      <span id="grid-size-error-text"></span>
      <button class="btn-mini" id="grid-error-accept" style="padding:3px 8px;">Accept</button>
    </div>
    <div class="row">
      <label><input type="checkbox" id="infinite-grid-toggle"> Infinite Grid</label>
    </div>
    <div class="row">
      <label><input type="checkbox" id="checkerboard-toggle"> Checkerboard</label>
    </div>
    <div class="row" style="padding-left:20px;">
      <label><input type="checkbox" id="onion-skin-toggle" disabled> Onion skin overlay</label>
    </div>

    <div class="row tray-controls-row">
      Tray
      <button class="btn-mini btn-rotate" id="tray-rotate-btn" title="Rotate pieces as you drag them from the tray">&#10227; 0&deg;</button>
      <button class="btn-mini btn-flip" id="tray-flip-btn" title="Flip pieces as you drag them from the tray">&#8646;</button>
    </div>

    <div class="palette-section" id="section-standard">
      <div class="section-header" data-target="section-standard">
        <span>Standard</span><span class="chevron">&#9662;</span>
      </div>
      <div class="palette-tiles" id="standard-tiles"></div>
    </div>

    <div class="palette-section collapsed" id="section-pentomino">
      <div class="section-header" data-target="section-pentomino">
        <span>Pentominoes</span><span class="chevron">&#9662;</span>
      </div>
      <div class="palette-tiles" id="pentomino-tiles"></div>
    </div>

    <div class="palette-section" id="section-custom">
      <div class="section-header" data-target="section-custom">
        <span>Custom</span><span class="chevron">&#9662;</span>
      </div>
      <div class="palette-tiles" id="custom-tiles"></div>
    </div>
  </div>

</div>

<div class="modal-backdrop hidden" id="editor-modal">
  <div class="modal">
    <h2>Custom piece</h2>
    <input class="name-input" id="editor-name" maxlength="24" placeholder="Name">
    <div class="editor-label">Draw cells</div>
    <div id="editor-grid"></div>
    <div class="modal-btn-row" style="margin-top:8px;">
      <button class="btn-mini btn-rotate" id="editor-rotate">&#8635;</button>
      <button class="btn-mini btn-flip" id="editor-flip">&#8646;</button>
      <button class="btn-clear" id="editor-clear">&#10005;</button>
    </div>
    <div class="editor-label">Color</div>
    <div class="color-row" id="editor-colors"></div>
    <div class="modal-btn-row">
      <button class="btn-clear" id="editor-cancel">Cancel</button>
      <button class="btn-save" id="editor-save">Save</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════
   CONSTANTS & GEOMETRY HELPERS
═══════════════════════════════════════════════ */
let CELL = 46;           // recomputed by computeCellSize() so any grid size fits on screen
const GAP = 3;
const MAX_BOARD_PX = 460;
const MIN_CELL = 20, MAX_CELL = 52;
const EDITOR_SIZE = 8;
const CELL_E = 26;
const MUTED_PINK = '#c98a8f';

const PALETTE_COLORS = [
  '#c98a8f', '#c1666b', '#d9a441', '#6b8f71', '#4f8a8b',
  '#8c6a9c', '#7a9471', '#a34a4a', '#4a6b8a', '#c67d3f',
  '#9c7350', '#5c8a72', '#b8865a', '#6a5a8c', '#a6763f',
  '#5a7d8c', '#8f5c4a', '#7d8c4a', '#a44e6b', '#4a8c7a',
  '#8c6a4a', '#6b4a6b'
];

function computeCellSize(){
  const dim = Math.max(gridRows(), gridCols());
  const raw = Math.floor((MAX_BOARD_PX - (dim-1)*GAP) / dim);
  return Math.max(MIN_CELL, Math.min(MAX_CELL, raw));
}

function normalize(cells){
  const minR = Math.min(...cells.map(c=>c[0]));
  const minC = Math.min(...cells.map(c=>c[1]));
  return cells.map(([r,c])=>[r-minR, c-minC]);
}
function bounds(cells){
  return { rows: Math.max(...cells.map(c=>c[0]))+1, cols: Math.max(...cells.map(c=>c[1]))+1 };
}
function rotateCells(cells){
  const {rows} = bounds(cells);
  return normalize(cells.map(([r,c])=>[c, rows-1-r]));
}
function flipCells(cells){
  const {cols} = bounds(cells);
  return normalize(cells.map(([r,c])=>[r, cols-1-c]));
}

/* ═══════════════════════════════════════════════
   FIXED PIECE SETS
═══════════════════════════════════════════════ */
const STANDARD_PIECES = [
  { name:'Mono',   color:'#c1666b', cells:[[0,0]] },
  { name:'Domino', color:'#d9a441', cells:[[0,0],[0,1]] },
  { name:'Tri I',  color:'#6b8f71', cells:[[0,0],[0,1],[0,2]] },
  { name:'Tri L',  color:'#c67d3f', cells:[[0,0],[1,0],[1,1]] },
  { name:'I', color:'#4f8a8b', cells:[[0,0],[0,1],[0,2],[0,3]] },
  { name:'O', color:'#d9a441', cells:[[0,0],[0,1],[1,0],[1,1]] },
  { name:'T', color:'#8c6a9c', cells:[[0,0],[0,1],[0,2],[1,1]] },
  { name:'S', color:'#7a9471', cells:[[0,1],[0,2],[1,0],[1,1]] },
  { name:'Z', color:'#a34a4a', cells:[[0,0],[0,1],[1,1],[1,2]] },
  { name:'J', color:'#4a6b8a', cells:[[0,0],[1,0],[1,1],[1,2]] },
  { name:'L', color:'#c67d3f', cells:[[0,2],[1,0],[1,1],[1,2]] },
];

const PENTOMINO_PIECES = [
  { name:'F', color:'#9c7350', cells:[[0,1],[0,2],[1,0],[1,1],[2,1]] },
  { name:'I', color:'#5c8a72', cells:[[0,0],[0,1],[0,2],[0,3],[0,4]] },
  { name:'L', color:'#b8865a', cells:[[0,0],[1,0],[2,0],[3,0],[3,1]] },
  { name:'N', color:'#6a5a8c', cells:[[0,1],[1,1],[2,0],[2,1],[3,0]] },
  { name:'P', color:'#a6763f', cells:[[0,0],[0,1],[1,0],[1,1],[2,0]] },
  { name:'T', color:'#5a7d8c', cells:[[0,0],[0,1],[0,2],[1,1],[2,1]] },
  { name:'U', color:'#8f5c4a', cells:[[0,0],[0,2],[1,0],[1,1],[1,2]] },
  { name:'V', color:'#7d8c4a', cells:[[0,0],[1,0],[2,0],[2,1],[2,2]] },
  { name:'W', color:'#a44e6b', cells:[[0,0],[1,0],[1,1],[2,1],[2,2]] },
  { name:'X', color:'#4a8c7a', cells:[[0,1],[1,0],[1,1],[1,2],[2,1]] },
  { name:'Y', color:'#8c6a4a', cells:[[0,1],[1,0],[1,1],[2,1],[3,1]] },
  { name:'Z', color:'#6b4a6b', cells:[[0,0],[0,1],[1,1],[2,1],[2,2]] },
];

function applyOverrides(key, piecesArray){
  try {
    const raw = localStorage.getItem('poly_overrides_'+key);
    if(!raw) return;
    const overrides = JSON.parse(raw);
    piecesArray.forEach(def=>{ if(overrides[def.name]) def.cells = overrides[def.name]; });
  } catch(e){}
}
function saveOverrides(key, piecesArray){
  const overrides = {};
  piecesArray.forEach(def=>{ overrides[def.name] = def.cells; });
  localStorage.setItem('poly_overrides_'+key, JSON.stringify(overrides));
}
applyOverrides('standard', STANDARD_PIECES);
applyOverrides('pentomino', PENTOMINO_PIECES);

/* ═══════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════ */
// The grid is tracked as an absolute-coordinate rectangle [minRow..maxRow] x
// [minCol..maxCol] rather than a fixed 0-based size. This lets Infinite Grid
// mode expand a specific side (e.g. just the right edge) without ever having
// to shift existing pieces' stored anchorRow/anchorCol — only the rendering
// offset (see pxCol/pxRow) and the bounds checks change.
let gridMinRow, gridMaxRow, gridMinCol, gridMaxCol;
(function initGridBounds(){
  let bounds = null;
  try { bounds = JSON.parse(localStorage.getItem('poly_gridBounds')); } catch(e){}
  if(bounds && typeof bounds.minRow === 'number'){
    ({minRow:gridMinRow, maxRow:gridMaxRow, minCol:gridMinCol, maxCol:gridMaxCol} = bounds);
  } else {
    const n = parseInt(localStorage.getItem('poly_gridSize')) || 8;
    gridMinRow = 0; gridMaxRow = n-1; gridMinCol = 0; gridMaxCol = n-1;
  }
})();
function gridRows(){ return gridMaxRow - gridMinRow + 1; }
function gridCols(){ return gridMaxCol - gridMinCol + 1; }
function saveGridBounds(){
  localStorage.setItem('poly_gridBounds', JSON.stringify({minRow:gridMinRow, maxRow:gridMaxRow, minCol:gridMinCol, maxCol:gridMaxCol}));
}

let infiniteGrid = localStorage.getItem('poly_infiniteGrid') === 'true';
const INFINITE_MIN_DIM = 8;
const EXPAND_BUFFER = 2;

/* ═══════════════════════════════════════════════
   CHECKERBOARD / CELL PATTERNS
   Built as a generic "pattern index per cell" system rather than a
   hardcoded 2-color checkerboard, so a future more intricate design is
   just a different patternIndexFor() + a longer CHECKERBOARD_COLORS /
   CHECKERBOARD_LABELS list — nothing else (rendering, counts, the onion
   skin overlay) needs to change to support more than 2 groups.
═══════════════════════════════════════════════ */
const CHECKERBOARD_COLORS = ['var(--checker-0)', 'var(--checker-1)'];
const CHECKERBOARD_LABELS = ['Black', 'White'];
function patternIndexFor(r, c){
  const n = CHECKERBOARD_COLORS.length;
  return ((r + c) % n + n) % n; // double-mod: r/c can be negative in Infinite Grid mode
}

let checkerboardEnabled = localStorage.getItem('poly_checkerboard') === 'true';
let onionSkinEnabled = checkerboardEnabled && localStorage.getItem('poly_onionSkin') === 'true';

function renderCheckerOverlay(){
  const overlay = document.getElementById('checker-overlay');
  overlay.innerHTML = '';
  if(!checkerboardEnabled || !onionSkinEnabled) return;
  // Onion skin only matters where it's actually hiding something — draw it
  // only over squares a piece currently covers, not the whole board.
  const covered = new Set();
  placedPieces.forEach(p=>p.cells.forEach(([r,c])=>{
    const rr = p.anchorRow+r, cc = p.anchorCol+c;
    if(rr>=gridMinRow && rr<=gridMaxRow && cc>=gridMinCol && cc<=gridMaxCol) covered.add(rr+','+cc);
  }));
  covered.forEach(key=>{
    const [r,c] = key.split(',').map(Number);
    const cell = document.createElement('div');
    cell.className = 'checker-overlay-cell';
    cell.style.left = pxCol(c) + 'px';
    cell.style.top = pxRow(r) + 'px';
    cell.style.width = CELL + 'px';
    cell.style.height = CELL + 'px';
    cell.style.background = CHECKERBOARD_COLORS[patternIndexFor(r,c)];
    overlay.appendChild(cell);
  });
}

function updateCheckerCounts(){
  const el = document.getElementById('checker-counts');
  if(!checkerboardEnabled){ el.style.display = 'none'; return; }
  el.style.display = 'block';
  const counts = new Array(CHECKERBOARD_COLORS.length).fill(0);
  const seen = new Set();
  placedPieces.forEach(p=>p.cells.forEach(([r,c])=>{
    const rr = p.anchorRow+r, cc = p.anchorCol+c;
    if(rr<gridMinRow || rr>gridMaxRow || cc<gridMinCol || cc>gridMaxCol) return;
    const key = rr+','+cc;
    if(seen.has(key)) return; // overlapping pieces shouldn't double-count a square
    seen.add(key);
    counts[patternIndexFor(rr,cc)]++;
  }));
  el.innerHTML = CHECKERBOARD_LABELS.map((label,i)=>`${label}: <b>${counts[i]||0}</b>`).join(' &nbsp; ');
}

// Grow the grid to keep `piece` comfortably inside it — only on the side(s)
// it's actually near, so pushing a piece toward the right edge only grows
// the right side (an existing piece's stored coordinates never change).
function maybeExpandGrid(piece){
  if(!infiniteGrid || !piece) return;
  const {rows, cols} = bounds(piece.cells);
  let changed = false;
  if(piece.anchorRow <= gridMinRow){ gridMinRow = Math.min(gridMinRow, piece.anchorRow) - EXPAND_BUFFER; changed = true; }
  if(piece.anchorRow + rows - 1 >= gridMaxRow){ gridMaxRow = Math.max(gridMaxRow, piece.anchorRow+rows-1) + EXPAND_BUFFER; changed = true; }
  if(piece.anchorCol <= gridMinCol){ gridMinCol = Math.min(gridMinCol, piece.anchorCol) - EXPAND_BUFFER; changed = true; }
  if(piece.anchorCol + cols - 1 >= gridMaxCol){ gridMaxCol = Math.max(gridMaxCol, piece.anchorCol+cols-1) + EXPAND_BUFFER; changed = true; }
  if(changed){ saveGridBounds(); setupBoard(); }
}

// Shrink the grid back when its outermost row/col has no pieces left in it,
// down to a sensible minimum — the mirror image of maybeExpandGrid.
function maybeContractGrid(){
  if(!infiniteGrid) return;
  const rowHasPiece = r => placedPieces.some(p=>p.cells.some(([dr])=>p.anchorRow+dr===r));
  const colHasPiece = c => placedPieces.some(p=>p.cells.some(([,dc])=>p.anchorCol+dc===c));
  let changed = false;
  while(gridRows() > INFINITE_MIN_DIM && !rowHasPiece(gridMinRow)){ gridMinRow++; changed = true; }
  while(gridRows() > INFINITE_MIN_DIM && !rowHasPiece(gridMaxRow)){ gridMaxRow--; changed = true; }
  while(gridCols() > INFINITE_MIN_DIM && !colHasPiece(gridMinCol)){ gridMinCol++; changed = true; }
  while(gridCols() > INFINITE_MIN_DIM && !colHasPiece(gridMaxCol)){ gridMaxCol--; changed = true; }
  if(changed){ saveGridBounds(); setupBoard(); }
}

/* Tray transform: rotates/flips pieces as they're dragged from the tray.
   Only affects future drags-from-tray — never retroactively touches pieces
   already placed on the board. */
let trayRotation = 0; // 0, 90, 180, 270
let trayFlipped = false;
function applyTrayTransform(cells){
  let result = trayFlipped ? flipCells(cells) : cells;
  for(let i=0; i<trayRotation/90; i++) result = rotateCells(result);
  return result;
}

function defaultCustomPiece(id){
  return {
    id, name: 'Custom ' + id.split('-')[1],
    cells: [[0,0],[0,1],[0,2],[0,3],[0,4]],
    color: MUTED_PINK,
    edited: false
  };
}

let customPieces = loadCustomPieces();
function loadCustomPieces(){
  try {
    const raw = localStorage.getItem('poly_customPieces');
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed) && parsed.length) return parsed;
    }
  } catch(e){}
  return [defaultCustomPiece('custom-1')];
}
function saveCustomPieces(){
  localStorage.setItem('poly_customPieces', JSON.stringify(customPieces));
}
let customIdCounter = customPieces.reduce((m,p)=>{
  const n = parseInt(p.id.split('-')[1])||0;
  return Math.max(m,n);
},0) + 1;

let placedPieces = [];   // {id, cells, color, name, anchorRow, anchorCol}
let placedIdCounter = 1;

// Multiple pieces can be selected at once (shift-click to add/remove one).
// A single click still replaces the whole selection with just that piece.
let selectedIds = new Set();

// Any piece currently sitting invalid — overlapping another piece, or
// extending past the grid edge in fixed-size mode. While non-empty,
// selection is locked: you can keep moving/rotating/flipping/deleting
// pieces that are pending OR already part of the current selection, but
// selecting or dragging anything outside that is blocked (with an
// on-screen message) until everything pending is valid again or removed.
let pendingPlacementIds = new Set();

function isLocked(){ return pendingPlacementIds.size > 0; }
function canInteractWith(id){
  return !isLocked() || pendingPlacementIds.has(id) || selectedIds.has(id);
}

function updatePendingPlacement(pieceId){
  const piece = placedPieces.find(p=>p.id===pieceId);
  const valid = piece && isValidPlacement(piece.cells, piece.anchorRow, piece.anchorCol, piece.id);
  if(!valid) pendingPlacementIds.add(pieceId);
  else pendingPlacementIds.delete(pieceId);
}

let blockedMsgTimer = null;
function showBlockedMessage(){
  const el = document.getElementById('error-toast');
  el.textContent = 'Previous piece not placed in the right place';
  el.classList.add('visible');
  clearTimeout(blockedMsgTimer);
  blockedMsgTimer = setTimeout(()=> el.classList.remove('visible'), 2500);
}

let undoStack = [];
const UNDO_LIMIT = 50;
function pushUndo(){
  undoStack.push(JSON.stringify({
    placedPieces,
    selectedIds: [...selectedIds],
    pendingPlacementIds: [...pendingPlacementIds],
    gridMinRow, gridMaxRow, gridMinCol, gridMaxCol
  }));
  if(undoStack.length > UNDO_LIMIT) undoStack.shift();
}
function undo(){
  if(!undoStack.length) return;
  const snap = JSON.parse(undoStack.pop());
  placedPieces = snap.placedPieces;
  selectedIds = new Set(snap.selectedIds);
  pendingPlacementIds = new Set(snap.pendingPlacementIds);
  gridMinRow = snap.gridMinRow; gridMaxRow = snap.gridMaxRow;
  gridMinCol = snap.gridMinCol; gridMaxCol = snap.gridMaxCol;
  setupBoard();
  renderAll();
}

const boardEl = document.getElementById('board');
const piecesLayerEl = document.getElementById('pieces-layer');
const trashZoneEl = document.getElementById('trash-zone');

/* ═══════════════════════════════════════════════
   BOARD SETUP
═══════════════════════════════════════════════ */
function setupBoard(){
  CELL = computeCellSize();
  const rows = gridRows(), cols = gridCols();
  boardEl.style.gridTemplateColumns = `repeat(${cols}, ${CELL}px)`;
  boardEl.style.gridTemplateRows = `repeat(${rows}, ${CELL}px)`;
  boardEl.style.gap = GAP + 'px';
  boardEl.innerHTML = '';
  for(let i=0;i<rows;i++){
    for(let j=0;j<cols;j++){
      const r = gridMinRow + i, c = gridMinCol + j;
      const cell = document.createElement('div');
      cell.className = 'board-cell' + (checkerboardEnabled ? ' pat'+patternIndexFor(r,c) : '');
      cell.dataset.r = r;
      cell.dataset.c = c;
      boardEl.appendChild(cell);
    }
  }
  document.getElementById('total-count').textContent = rows*cols;
  renderCheckerOverlay();
  updateCheckerCounts();
}

function occupied(excludeId){
  const set = new Set();
  placedPieces.forEach(p=>{
    if(p.id === excludeId) return;
    p.cells.forEach(([r,c])=>set.add((p.anchorRow+r)+','+(p.anchorCol+c)));
  });
  return set;
}

function isValidPlacement(cells, anchorRow, anchorCol, excludeId){
  const occ = occupied(excludeId);
  for(const [r,c] of cells){
    const rr = anchorRow+r, cc = anchorCol+c;
    if(rr<gridMinRow || cc<gridMinCol || rr>gridMaxRow || cc>gridMaxCol) return false;
    if(occ.has(rr+','+cc)) return false;
  }
  return true;
}

// A piece only gets deleted by dragging it off the board once NONE of its
// cells overlap the grid at all — partially overlapping the border is a
// valid (if "invalid-tinted") place for it to sit, per the placement rules.
function isCompletelyOffBoard(cells, anchorRow, anchorCol){
  const {rows, cols} = bounds(cells);
  return (anchorRow+rows-1 < gridMinRow) || (anchorRow > gridMaxRow) ||
         (anchorCol+cols-1 < gridMinCol) || (anchorCol > gridMaxCol);
}

function findOpenAnchor(cells, prefRow, prefCol){
  const {rows, cols} = bounds(cells);
  if(rows>gridRows() || cols>gridCols()) return null;
  let best = null, bestDist = Infinity;
  for(let r=gridMinRow; r<=gridMaxRow-rows+1; r++){
    for(let c=gridMinCol; c<=gridMaxCol-cols+1; c++){
      if(isValidPlacement(cells, r, c, null)){
        const dist = Math.abs(r-prefRow) + Math.abs(c-prefCol);
        if(dist < bestDist){ bestDist = dist; best = {row:r, col:c}; }
      }
    }
  }
  return best;
}

function updateHolesCount(){
  const covered = new Set();
  placedPieces.forEach(p=>p.cells.forEach(([r,c])=>{
    const rr=p.anchorRow+r, cc=p.anchorCol+c;
    if(rr>=gridMinRow && rr<=gridMaxRow && cc>=gridMinCol && cc<=gridMaxCol) covered.add(rr+','+cc);
  }));
  document.getElementById('holes-count').textContent = gridRows()*gridCols() - covered.size;
  updateCheckerCounts();
  renderCheckerOverlay();
}

function pxPos(index){ return index*(CELL+GAP); }
function pxCol(absCol){ return pxPos(absCol - gridMinCol); }
function pxRow(absRow){ return pxPos(absRow - gridMinRow); }

/* ═══════════════════════════════════════════════
   SOLID SHAPE RENDERING
   A piece is drawn as one seamless solid shape: each cell is absolutely
   positioned and, on any side where a same-piece cell is adjacent, is
   widened to swallow the gap and has no border there — so a piece's own
   cells fuse together with no visible seams, while the outer silhouette
   still gets a border/shadow/rounded corners. That's what keeps two
   same-colored pieces visually distinct when placed touching each other:
   the real gap between *different* pieces is untouched; only the seams
   *inside* one piece disappear.
═══════════════════════════════════════════════ */
function hasCellAt(cells, r, c){ return cells.some(([cr,cc])=>cr===r&&cc===c); }

// Fill path: each cell's true square, plus a bridging rectangle toward every
// internally-adjacent neighbor (and a small corner patch for 2x2 blocks) —
// all as ONE path, so it paints as a single seamless region.
// The rectangles that make up a piece's seamless footprint: each cell's
// true square, plus a bridging rectangle toward every internally-adjacent
// neighbor (and a small corner patch for 2x2 blocks). Shared by the fill
// path and the outline trace below, so both agree on exactly what area
// the piece covers.
function buildPieceRects(cells, cellSize, gapSize){
  const rects = [];
  cells.forEach(([r,c])=>{
    const x = c*(cellSize+gapSize), y = r*(cellSize+gapSize);
    rects.push([x, y, x+cellSize, y+cellSize]);
    if(hasCellAt(cells, r, c+1)) rects.push([x+cellSize, y, x+cellSize+gapSize, y+cellSize]);
    if(hasCellAt(cells, r+1, c)) rects.push([x, y+cellSize, x+cellSize, y+cellSize+gapSize]);
    if(hasCellAt(cells, r, c+1) && hasCellAt(cells, r+1, c) && hasCellAt(cells, r+1, c+1)){
      rects.push([x+cellSize, y+cellSize, x+cellSize+gapSize, y+cellSize+gapSize]); // 2x2 corner join
    }
  });
  return rects;
}

function buildFillPath(cells, cellSize, gapSize){
  return buildPieceRects(cells, cellSize, gapSize)
    .map(([x0,y0,x1,y1]) => `M${x0},${y0} H${x1} V${y1} H${x0} Z`)
    .join(' ');
}

// Outline path: traces the boundary of the same rectangle union used for
// the fill, as one connected loop per boundary component, so the border
// renders as a single continuous stroke instead of one border segment per
// cell. (Per-cell borders were the actual cause of the visible "grid
// lines" — separate elements can each get their own border independently
// anti-aliased/composited by the browser, which shows as a hairline seam
// on some displays even when the edges are computed to align exactly.)
//
// Approach: collect every x/y coordinate that appears in any rectangle,
// use them to build a fine (non-uniform) grid, mark which fine cells fall
// inside some rectangle, then trace THAT grid's boundary with the
// standard per-cell-edge algorithm. Because every rectangle's edges are
// drawn from this one shared coordinate set, adjacent filled fine-cells
// always meet at an exact shared point — including at T-junctions and
// other concave corners, which a simpler per-cell extension can't get
// right (two non-adjacent cells' edges need to meet at one point there).
function buildOutlinePath(cells, cellSize, gapSize){
  const rects = buildPieceRects(cells, cellSize, gapSize);
  const xsSet = new Set(), ysSet = new Set();
  rects.forEach(([x0,y0,x1,y1])=>{ xsSet.add(x0); xsSet.add(x1); ysSet.add(y0); ysSet.add(y1); });
  const xs = [...xsSet].sort((a,b)=>a-b);
  const ys = [...ysSet].sort((a,b)=>a-b);
  const nx = xs.length-1, ny = ys.length-1;
  const occ = Array.from({length:ny}, ()=>Array(nx).fill(false));
  for(let iy=0; iy<ny; iy++){
    const cy = (ys[iy]+ys[iy+1])/2;
    for(let ix=0; ix<nx; ix++){
      const cx = (xs[ix]+xs[ix+1])/2;
      occ[iy][ix] = rects.some(([x0,y0,x1,y1]) => cx>x0 && cx<x1 && cy>y0 && cy<y1);
    }
  }
  const occAt = (iy,ix) => (iy>=0 && iy<ny && ix>=0 && ix<nx) ? occ[iy][ix] : false;
  const next = new Map();
  const key = (x,y)=> x+','+y;
  for(let iy=0; iy<ny; iy++){
    for(let ix=0; ix<nx; ix++){
      if(!occ[iy][ix]) continue;
      const x0=xs[ix], x1=xs[ix+1], y0=ys[iy], y1=ys[iy+1];
      if(!occAt(iy-1,ix)) next.set(key(x0,y0), [x1,y0]);
      if(!occAt(iy,ix+1)) next.set(key(x1,y0), [x1,y1]);
      if(!occAt(iy+1,ix)) next.set(key(x1,y1), [x0,y1]);
      if(!occAt(iy,ix-1)) next.set(key(x0,y1), [x0,y0]);
    }
  }
  const visited = new Set();
  const loops = [];
  for(const startKey of next.keys()){
    if(visited.has(startKey)) continue;
    const pts = [];
    let curKey = startKey, guard = 0;
    do {
      visited.add(curKey);
      pts.push(curKey.split(',').map(Number));
      const n = next.get(curKey);
      if(!n) break;
      curKey = key(n[0], n[1]);
      guard++;
    } while(curKey !== startKey && guard < 10000);
    if(pts.length >= 3) loops.push(pts);
  }
  // drop collinear intermediate points for a tidier path
  const simplified = loops.map(pts=>{
    const n = pts.length;
    return pts.filter((cur,i)=>{
      const prev = pts[(i-1+n)%n], nxt = pts[(i+1)%n];
      const dx1=cur[0]-prev[0], dy1=cur[1]-prev[1], dx2=nxt[0]-cur[0], dy2=nxt[1]-cur[1];
      return dx1*dy2 - dy1*dx2 !== 0;
    });
  });
  return simplified.map(pts => 'M'+pts.map(p=>p.join(',')).join('L')+'Z').join(' ');
}

const SVG_NS = 'http://www.w3.org/2000/svg';

function buildSolidShape(cells, color, cellSize, gapSize){
  const {rows, cols} = bounds(cells);
  const totalW = cols*cellSize + (cols-1)*gapSize;
  const totalH = rows*cellSize + (rows-1)*gapSize;

  const container = document.createElement('div');
  container.className = 'tile-grid';
  container.style.position = 'relative';
  container.style.width = totalW + 'px';
  container.style.height = totalH + 'px';

  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('width', totalW);
  svg.setAttribute('height', totalH);
  svg.setAttribute('viewBox', `0 0 ${totalW} ${totalH}`);
  svg.classList.add('piece-svg');
  svg.style.position = 'absolute';
  svg.style.left = '0';
  svg.style.top = '0';
  svg.style.overflow = 'visible';

  const fillPath = document.createElementNS(SVG_NS, 'path');
  fillPath.setAttribute('d', buildFillPath(cells, cellSize, gapSize));
  fillPath.setAttribute('fill', color);
  svg.appendChild(fillPath);

  const outlinePath = document.createElementNS(SVG_NS, 'path');
  outlinePath.setAttribute('d', buildOutlinePath(cells, cellSize, gapSize));
  outlinePath.setAttribute('fill', 'none');
  outlinePath.setAttribute('stroke', 'rgba(0,0,0,0.45)');
  outlinePath.setAttribute('stroke-width', '2');
  outlinePath.setAttribute('stroke-linejoin', 'round');
  svg.appendChild(outlinePath);

  container.appendChild(svg);

  // Invisible per-cell hit targets, purely so drag code can read which
  // exact cell (dr/dc) was grabbed — no visual styling here at all, so
  // they can't reintroduce the seam problem.
  cells.forEach(([r,c])=>{
    const blk = document.createElement('div');
    blk.className = 'blk';
    blk.dataset.dr = r;
    blk.dataset.dc = c;
    blk.style.position = 'absolute';
    blk.style.left = (c*(cellSize+gapSize)) + 'px';
    blk.style.top = (r*(cellSize+gapSize)) + 'px';
    blk.style.width = cellSize + 'px';
    blk.style.height = cellSize + 'px';
    container.appendChild(blk);
  });
  return container;
}

/* ═══════════════════════════════════════════════
   RENDERING
═══════════════════════════════════════════════ */
function renderPlacedPieces(){
  piecesLayerEl.innerHTML = '';
  placedPieces.forEach(p=>{
    const wrap = document.createElement('div');
    wrap.className = 'placed-piece'
      + (selectedIds.has(p.id) ? ' selected' : '')
      + (pendingPlacementIds.has(p.id) ? ' invalid' : '');
    wrap.style.left = pxCol(p.anchorCol) + 'px';
    wrap.style.top = pxRow(p.anchorRow) + 'px';
    wrap.dataset.id = p.id;
    wrap.appendChild(buildSolidShape(p.cells, p.color, CELL, GAP));
    piecesLayerEl.appendChild(wrap);
  });
  updateHolesCount();
}

function renderAll(){
  renderPlacedPieces();
  updateSelToolbar();
}

/* ═══════════════════════════════════════════════
   TILE PREVIEW RENDERING
═══════════════════════════════════════════════ */
function buildTilePreview(cells, color, cellPx){
  return buildSolidShape(cells, color, cellPx, 2);
}

/* ═══════════════════════════════════════════════
   PALETTE RENDERING
═══════════════════════════════════════════════ */
function renderFixedTiles(containerId, piecesArray, overrideKey){
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  piecesArray.forEach(def=>{
    const effectiveCells = applyTrayTransform(def.cells);
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.appendChild(buildTilePreview(effectiveCells, def.color, 13));
    const label = document.createElement('div');
    label.className = 'tile-name';
    label.textContent = def.name;
    tile.appendChild(label);

    const rotateBtn = document.createElement('button');
    rotateBtn.className = 'tile-btn rotate pair btn-rotate';
    rotateBtn.textContent = '↻';
    rotateBtn.title = 'Rotate';
    rotateBtn.onclick = (e)=>{
      e.stopPropagation();
      def.cells = rotateCells(def.cells);
      saveOverrides(overrideKey, piecesArray);
      renderFixedTiles(containerId, piecesArray, overrideKey);
    };
    tile.appendChild(rotateBtn);

    const flipBtn = document.createElement('button');
    flipBtn.className = 'tile-btn flip pair btn-flip';
    flipBtn.textContent = '⇆';
    flipBtn.title = 'Flip';
    flipBtn.onclick = (e)=>{
      e.stopPropagation();
      def.cells = flipCells(def.cells);
      saveOverrides(overrideKey, piecesArray);
      renderFixedTiles(containerId, piecesArray, overrideKey);
    };
    tile.appendChild(flipBtn);

    tile.addEventListener('pointerdown', e=>{
      if(e.target.closest('.tile-btn')) return;
      startDragFromTile(e, effectiveCells, def.color, def.name);
    });
    container.appendChild(tile);
  });
}
function renderStandardTiles(){ renderFixedTiles('standard-tiles', STANDARD_PIECES, 'standard'); }
function renderPentominoTiles(){ renderFixedTiles('pentomino-tiles', PENTOMINO_PIECES, 'pentomino'); }

function renderCustomTiles(){
  const container = document.getElementById('custom-tiles');
  container.innerHTML = '';
  customPieces.forEach(def=>{
    const effectiveCells = applyTrayTransform(def.cells);
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.appendChild(buildTilePreview(effectiveCells, def.color, 13));
    const label = document.createElement('div');
    label.className = 'tile-name';
    label.textContent = def.name;
    tile.appendChild(label);

    const editBtn = document.createElement('button');
    editBtn.className = 'tile-btn edit';
    editBtn.textContent = '✎';
    editBtn.title = 'Edit';
    editBtn.onclick = (e)=>{ e.stopPropagation(); openEditor(def.id); };
    tile.appendChild(editBtn);

    const rotateBtn = document.createElement('button');
    rotateBtn.className = 'tile-btn rotate btn-rotate';
    rotateBtn.textContent = '↻';
    rotateBtn.title = 'Rotate';
    rotateBtn.onclick = (e)=>{
      e.stopPropagation();
      def.cells = rotateCells(def.cells);
      def.edited = true;
      saveCustomPieces();
      renderCustomTiles();
    };
    tile.appendChild(rotateBtn);

    const flipBtn = document.createElement('button');
    flipBtn.className = 'tile-btn flip btn-flip';
    flipBtn.textContent = '⇆';
    flipBtn.title = 'Flip';
    flipBtn.onclick = (e)=>{
      e.stopPropagation();
      def.cells = flipCells(def.cells);
      def.edited = true;
      saveCustomPieces();
      renderCustomTiles();
    };
    tile.appendChild(flipBtn);

    if(customPieces.length > 1){
      const delBtn = document.createElement('button');
      delBtn.className = 'tile-btn del';
      delBtn.textContent = '✕';
      delBtn.title = 'Remove';
      delBtn.onclick = (e)=>{
        e.stopPropagation();
        customPieces = customPieces.filter(p=>p.id!==def.id);
        saveCustomPieces();
        renderCustomTiles();
      };
      tile.appendChild(delBtn);
    }

    tile.addEventListener('pointerdown', e=>{
      if(e.target !== tile && e.target.closest('.tile-btn')) return;
      startDragFromTile(e, effectiveCells, def.color, def.name);
    });
    container.appendChild(tile);
  });

  const addTile = document.createElement('div');
  addTile.className = 'add-tile';
  addTile.textContent = '+';
  addTile.title = 'New custom piece';
  addTile.onclick = ()=>{
    const id = 'custom-' + (customIdCounter++);
    const piece = defaultCustomPiece(id);
    customPieces.push(piece);
    saveCustomPieces();
    renderCustomTiles();
    openEditor(id);
  };
  container.appendChild(addTile);
}

/* ═══════════════════════════════════════════════
   COLLAPSIBLE SECTIONS
═══════════════════════════════════════════════ */
document.querySelectorAll('.section-header').forEach(h=>{
  h.addEventListener('click', ()=>{
    const section = document.getElementById(h.dataset.target);
    section.classList.toggle('collapsed');
    localStorage.setItem('poly_collapsed_'+h.dataset.target, section.classList.contains('collapsed'));
  });

(function restoreCollapseState(){
  ['section-standard','section-pentomino','section-custom'].forEach(id=>{
    const stored = localStorage.getItem('poly_collapsed_'+id);
    if(stored===null) return;
    document.getElementById(id).classList.toggle('collapsed', stored==='true');
  });
})();

/* ═══════════════════════════════════════════════
   DRAG (tray → board, board → board)
═══════════════════════════════════════════════ */
let drag = null;
/* drag = {mode:'new'|'move', cells, color, name, grabDR, grabDC, ghostEl,
           sourceId, startX, startY, moved} */

function makeGhost(cells, color){
  const ghost = document.createElement('div');
  ghost.className = 'ghost';
  ghost.appendChild(buildSolidShape(cells, color, CELL, GAP));
  piecesLayerEl.appendChild(ghost);
  return ghost;
}

function startDragFromTile(e, cells, color, name){
  if(isLocked()){ showBlockedMessage(); return; }
  e.preventDefault();
  const {rows, cols} = bounds(cells);
  const grabDR = Math.floor((rows-1)/2);
  const grabDC = Math.floor((cols-1)/2);
  const ghostEl = makeGhost(cells, color);
  drag = { mode:'new', cells: cells.map(c=>c.slice()), color, name, grabDR, grabDC, ghostEl, moved:true };
  updateDrag(e.clientX, e.clientY);
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragEnd);
}

function startDragFromPlaced(e, piece){
  e.preventDefault();
  e.stopPropagation();
  selectPiece(piece.id);
  const blk = e.target.closest('.blk');
  const dr = blk ? parseInt(blk.dataset.dr) : 0;
  const dc = blk ? parseInt(blk.dataset.dc) : 0;
  const ghostEl = makeGhost(piece.cells, piece.color);
  drag = {
    mode:'move', cells: piece.cells.map(c=>c.slice()), color: piece.color, name: piece.name,
    grabDR: dr, grabDC: dc, ghostEl, sourceId: piece.id,
    startX: e.clientX, startY: e.clientY, moved: false
  };
  updateDrag(e.clientX, e.clientY);
  const wrapEl = piecesLayerEl.querySelector(`[data-id="${piece.id}"]`);
  if(wrapEl) wrapEl.style.visibility = 'hidden';
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragEnd);
}

function clearHighlights(){
  document.querySelectorAll('.board-cell.hl-valid, .board-cell.hl-invalid').forEach(el=>{
    el.classList.remove('hl-valid','hl-invalid');
  });
}

/* Single source of truth for "where would this drag land right now". Used by
   both pointermove (ghost/highlights) and pointerup (commit), so the ghost
   you see and the cell you get always agree. The red/green tint is still
   shown during the drag as a hint — but per the placement rules, dropping
   on "invalid" no longer rejects the drop; it just leaves the piece there,
   tinted invalid, until it's fixed. */
function updateDrag(clientX, clientY){
  const rect = boardEl.getBoundingClientRect();
  const relX = clientX - rect.left;
  const relY = clientY - rect.top;
  const pointerCol = Math.floor(relX / (CELL+GAP)) + gridMinCol;
  const pointerRow = Math.floor(relY / (CELL+GAP)) + gridMinRow;
  const anchorRow = pointerRow - drag.grabDR;
  const anchorCol = pointerCol - drag.grabDC;
  const excludeId = drag.mode==='move' ? drag.sourceId : null;
  const valid = isValidPlacement(drag.cells, anchorRow, anchorCol, excludeId);

  drag.ghostEl.style.left = pxCol(anchorCol) + 'px';
  drag.ghostEl.style.top  = pxRow(anchorRow) + 'px';
  drag.ghostEl.classList.toggle('invalid', !valid);

  clearHighlights();
  drag.cells.forEach(([r,c])=>{
    const rr=anchorRow+r, cc=anchorCol+c;
    const cellEl = boardEl.querySelector(`.board-cell[data-r="${rr}"][data-c="${cc}"]`);
    if(cellEl) cellEl.classList.add(valid?'hl-valid':'hl-invalid');
  });

  return { anchorRow, anchorCol, valid };
}

function isOverTrashZone(clientX, clientY){
  const r = trashZoneEl.getBoundingClientRect();
  return clientX>=r.left && clientX<=r.right && clientY>=r.top && clientY<=r.bottom;
}

function onDragMove(e){
  if(!drag) return;
  if(drag.mode==='move'){
    if(Math.abs(e.clientX-drag.startX)>3 || Math.abs(e.clientY-drag.startY)>3) drag.moved = true;
  }
  const overTrash = isOverTrashZone(e.clientX, e.clientY);
  trashZoneEl.classList.toggle('drag-over', overTrash);
  drag.ghostEl.classList.toggle('trashing', overTrash);
  // While hovering the trash zone, leave the ghost at its last board
  // position (shrunk + faded) rather than running the board-relative math
  // for a point that isn't over the board at all — but do clear any
  // leftover green/red cell highlight from just before it crossed in.
  if(overTrash) clearHighlights();
  else updateDrag(e.clientX, e.clientY);
}

// Dragging a piece off the grid edge no longer deletes it — that's what
// used to conflict with Infinite Grid's expansion (the two features were
// fighting over what an off-board drop should mean). Deletion now only
// happens via this explicit trash zone, for both a new tray piece (just
// cancels its creation) and an existing placed piece (removes it).
function onDragEnd(e){
  if(!drag) return;
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragEnd);

  if(drag.mode==='move'){
    if(Math.abs(e.clientX-drag.startX)>3 || Math.abs(e.clientY-drag.startY)>3) drag.moved = true;
  }

  const overTrash = isOverTrashZone(e.clientX, e.clientY);
  trashZoneEl.classList.remove('drag-over');
  clearHighlights();
  drag.ghostEl.remove();

  if(overTrash){
    if(drag.mode==='move' && drag.moved){
      pushUndo();
      placedPieces = placedPieces.filter(p=>p.id!==drag.sourceId);
      pendingPlacementIds.delete(drag.sourceId);
      selectedIds.delete(drag.sourceId);
      maybeContractGrid();
    }
    drag = null;
    renderAll();
    return;
  }

  const { anchorRow, anchorCol } = updateDrag(e.clientX, e.clientY);

  if(drag.mode==='new'){
    // A brand new piece never dropped anywhere on the board at all just
    // cancels; anything that overlaps the grid at all gets placed, valid
    // or not (grid locking still applies — it snaps to the cell grid).
    if(!isCompletelyOffBoard(drag.cells, anchorRow, anchorCol)){
      pushUndo();
      const id = 'p'+(placedIdCounter++);
      const piece = { id, cells: drag.cells, color: drag.color, name: drag.name, anchorRow, anchorCol };
      placedPieces.push(piece);
      selectedIds.clear();
      selectedIds.add(id);
      maybeExpandGrid(piece);
      updatePendingPlacement(id);
    }
  } else if(drag.mode==='move'){
    const piece = placedPieces.find(p=>p.id===drag.sourceId);
    if(piece && drag.moved){
      pushUndo();
      piece.anchorRow = anchorRow;
      piece.anchorCol = anchorCol;
      maybeExpandGrid(piece);
      updatePendingPlacement(piece.id);
      maybeContractGrid();
    }
  }
  // updateDrag() above re-adds hl-valid/hl-invalid as a side effect of
  // computing the final anchor — clear them again now that the drop is
  // actually committed, or they'd linger on the board forever (nothing
  // else ever touches .board-cell classes outside an active drag).
  clearHighlights();
  drag = null;
  renderAll();
}

/* ═══════════════════════════════════════════════
   SELECTION / ROTATE / FLIP / DUPLICATE / DELETE
═══════════════════════════════════════════════ */
function selectPiece(id){
  if(isLocked() && !canInteractWith(id)){ showBlockedMessage(); return; }
  selectedIds.clear();
  selectedIds.add(id);
  renderAll();
}

// Shift-click toggles one piece's membership in the selection without
// touching the rest — this is how you build a multi-piece selection before
// letting go of shift and using arrow keys / rotate / flip on all of them.
function toggleSelectPiece(id){
  if(isLocked() && !canInteractWith(id)){ showBlockedMessage(); return; }
  if(selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
  renderAll();
}

function deselect(){
  if(isLocked()) return; // must resolve it before it's allowed to lose focus
  selectedIds.clear();
  renderAll();
}

function deleteSelected(){
  if(selectedIds.size===0) return;
  pushUndo();
  const ids = new Set(selectedIds);
  placedPieces = placedPieces.filter(p=>!ids.has(p.id));
  ids.forEach(id=>{ pendingPlacementIds.delete(id); selectedIds.delete(id); });
  maybeContractGrid();
  renderAll();
}

// Rotate/flip always apply in place — never auto-relocated to find a fit.
// If that leaves a piece invalid, it just stays there tinted red until
// moved (arrow keys or drag) into a valid spot.
//
// With more than one piece selected, this rotates/flips the WHOLE
// selection as one rigid shape: each piece's own orientation transforms
// exactly like the single-piece case, AND its position moves around the
// group's shared bounding box, using the same per-cell transform logic
// (rotateCells/flipCells) a lone piece would use — just applied to the
// group's frame instead of one piece's own cells.
function transformSelected(fn){
  if(selectedIds.size===0) return;
  const pieces = [...selectedIds].map(id=>placedPieces.find(p=>p.id===id)).filter(Boolean);
  if(pieces.length===0) return;

  if(pieces.length===1){
    const piece = pieces[0];
    pushUndo();
    piece.cells = fn(piece.cells);
    maybeExpandGrid(piece);
    updatePendingPlacement(piece.id);
    maybeContractGrid();
    renderAll();
    return;
  }

  pushUndo();
  let minR=Infinity, minC=Infinity, maxR=-Infinity, maxC=-Infinity;
  pieces.forEach(p=>{
    const {rows,cols} = bounds(p.cells);
    minR = Math.min(minR, p.anchorRow); minC = Math.min(minC, p.anchorCol);
    maxR = Math.max(maxR, p.anchorRow+rows-1); maxC = Math.max(maxC, p.anchorCol+cols-1);
  });
  const groupRows = maxR-minR+1, groupCols = maxC-minC+1;
  const isRotate = (fn === rotateCells);
  pieces.forEach(p=>{
    const {rows:pr, cols:pc} = bounds(p.cells);
    const localR = p.anchorRow - minR, localC = p.anchorCol - minC;
    // Transform the piece's own bounding-box corners within the group's
    // frame using the exact same point rule rotateCells/flipCells uses,
    // then the new top-left corner is just the min of those — this works
    // generically for any such transform without hand-deriving a separate
    // anchor formula per transform type.
    const corners = [[localR,localC],[localR,localC+pc-1],[localR+pr-1,localC],[localR+pr-1,localC+pc-1]];
    const transformed = corners.map(([r,c]) => isRotate ? [c, groupRows-1-r] : [r, groupCols-1-c]);
    const newLocalR = Math.min(...transformed.map(t=>t[0]));
    const newLocalC = Math.min(...transformed.map(t=>t[1]));
    p.cells = fn(p.cells);
    p.anchorRow = minR + newLocalR;
    p.anchorCol = minC + newLocalC;
  });
  pieces.forEach(p=>{ maybeExpandGrid(p); updatePendingPlacement(p.id); });
  maybeContractGrid();
  renderAll();
}

// Auto-placement (finding the nearest open spot) happens ONLY here, for
// duplicate — never for rotate/flip/arrow moves. If there's no open spot,
// the copy lands directly on top of the original (allowed, since overlap is
// permitted) and becomes the piece that needs fixing. Only works on a
// single selected piece — duplicating a multi-piece group isn't supported.
function duplicateSelected(){
  if(selectedIds.size !== 1) return;
  const id = [...selectedIds][0];
  const source = placedPieces.find(p=>p.id===id);
  if(!source) return;
  pushUndo();
  const anchor = findOpenAnchor(source.cells, source.anchorRow, source.anchorCol);
  const newId = 'p'+(placedIdCounter++);
  const newPiece = {
    id: newId, cells: source.cells.map(c=>c.slice()), color: source.color, name: source.name,
    anchorRow: anchor ? anchor.row : source.anchorRow,
    anchorCol: anchor ? anchor.col : source.anchorCol
  };
  placedPieces.push(newPiece);
  selectedIds.clear();
  selectedIds.add(newId);
  maybeExpandGrid(newPiece);
  updatePendingPlacement(newId);
  renderAll();
}

function updateSelToolbar(){
  let bar = document.getElementById('sel-toolbar');
  if(bar) bar.remove();
  if(selectedIds.size===0) return;

  const pieces = [...selectedIds].map(id=>placedPieces.find(p=>p.id===id)).filter(Boolean);
  if(pieces.length===0) return;

  // Bounding box of the whole selection on screen (just one piece in the
  // common case, several when multi-selected).
  let left=Infinity, top=Infinity, bottom=-Infinity;
  pieces.forEach(p=>{
    const wrapEl = piecesLayerEl.querySelector(`[data-id="${p.id}"]`);
    if(!wrapEl) return;
    const r = wrapEl.getBoundingClientRect();
    left = Math.min(left, r.left);
    top = Math.min(top, r.top);
    bottom = Math.max(bottom, r.bottom);
  });
  if(!isFinite(left)) return;

  bar = document.createElement('div');
  bar.className = 'sel-toolbar';
  bar.id = 'sel-toolbar';
  bar.style.left = left + 'px';
  // Prefer placing the toolbar above the selection, but flip below it when
  // there isn't enough headroom (e.g. sitting right under the trash zone)
  // so it never overlaps other UI.
  const controlsRect = trashZoneEl.getBoundingClientRect();
  const wouldOverlapControls = (top - 34) < controlsRect.bottom + 4;
  bar.style.top = (wouldOverlapControls ? bottom + 6 : top - 34) + 'px';

  const mk = (label, title, fn, cls)=>{
    const b = document.createElement('button');
    b.className = cls || 'btn-mini';
    b.textContent = label;
    b.title = title;
    b.onclick = fn;
    return b;
  };
  bar.appendChild(mk('↻','Rotate (R)', ()=>transformSelected(rotateCells), 'btn-mini btn-rotate'));
  bar.appendChild(mk('⇆','Flip (T)', ()=>transformSelected(flipCells), 'btn-mini btn-flip'));
  if(pieces.length===1) bar.appendChild(mk('⧉','Duplicate (D)', duplicateSelected));
  bar.appendChild(mk('✕','Delete (Del)', deleteSelected, 'btn-trash'));
  document.body.appendChild(bar);
}

/* ═══════════════════════════════════════════════
   KEYBOARD CONTROLS
═══════════════════════════════════════════════ */
const ARROW_DIRS = { ArrowUp:[-1,0], ArrowDown:[1,0], ArrowLeft:[0,-1], ArrowRight:[0,1] };

// Clicking a piece, a board cell, or a tile is clicking a plain <div> — none
// of that naturally moves keyboard focus away from whatever form control
// (the grid-size input, the Infinite Grid checkbox, ...) was last focused.
// Without this, keyboard focus can get "stuck" on a control indefinitely,
// silently blocking every shortcut below since they check what's focused.
document.addEventListener('pointerdown', e=>{
  const onFormControl = e.target.closest && e.target.closest('input, button, select, textarea, label');
  if(!onFormControl && document.activeElement && document.activeElement !== document.body){
    document.activeElement.blur();
  }
}, true);

document.addEventListener('keydown', e=>{
  // Only actual text-editable inputs need arrow keys/letters for their own
  // native behavior. A checkbox (or a button) keeps keyboard focus after
  // being clicked — a blanket "any INPUT" check silently ate every shortcut
  // afterward until the page was reloaded (focus reset), which is exactly
  // what made the Infinite Grid checkbox look broken.
  if(e.target.matches && e.target.matches('input[type=text], input[type=number], input[type=color]')) return;

  if(e.key==='z' || e.key==='Z'){ e.preventDefault(); undo(); return; }
  if(selectedIds.size===0) return;

  // Arrow keys always move every selected piece together, even into an
  // invalid position — no fit check, no auto-placement. That's the point:
  // this is how you rescue a piece that rotate/duplicate left sitting
  // somewhere invalid, and how a multi-piece selection (shift-click to
  // build it) moves as one unit once you let go of shift.
  if(ARROW_DIRS[e.key]){
    e.preventDefault();
    const [dr,dc] = ARROW_DIRS[e.key];
    const pieces = [...selectedIds].map(id=>placedPieces.find(p=>p.id===id)).filter(Boolean);
    if(pieces.length){
      pushUndo();
      pieces.forEach(p=>{ p.anchorRow += dr; p.anchorCol += dc; });
      pieces.forEach(p=>{ maybeExpandGrid(p); updatePendingPlacement(p.id); });
      maybeContractGrid();
      renderAll();
    }
    return;
  }
  if(e.key==='r' || e.key==='R'){ transformSelected(rotateCells); return; }
  if(e.key==='t' || e.key==='T' || e.key==='f' || e.key==='F'){ transformSelected(flipCells); return; }
  if(e.key==='d' || e.key==='D'){ duplicateSelected(); return; }
  if(e.key==='Delete' || e.key==='Backspace'){ e.preventDefault(); deleteSelected(); return; }
});

piecesLayerEl.addEventListener('pointerdown', e=>{
  const wrapEl = e.target.closest('.placed-piece');
  if(!wrapEl) return;
  const piece = placedPieces.find(p=>p.id===wrapEl.dataset.id);
  if(!piece) return;
  if(isLocked() && !canInteractWith(piece.id)){ showBlockedMessage(); return; }
  // Shift-click toggles this piece into/out of the selection and doesn't
  // start a drag — that's a separate gesture from moving pieces around.
  if(e.shiftKey){
    e.preventDefault();
    e.stopPropagation();
    toggleSelectPiece(piece.id);
    return;
  }
  startDragFromPlaced(e, piece);
});
piecesLayerEl.addEventListener('contextmenu', e=>{
  const wrapEl = e.target.closest('.placed-piece');
  if(!wrapEl) return;
  e.preventDefault();
  const id = wrapEl.dataset.id;
  if(isLocked() && !canInteractWith(id)){ showBlockedMessage(); return; }
  pushUndo();
  placedPieces = placedPieces.filter(p=>p.id!==id);
  selectedIds.delete(id);
  pendingPlacementIds.delete(id);
  maybeContractGrid();
  renderAll();
});
/* ═══════════════════════════════════════════════
   BOX (MARQUEE) SELECTION
   Click-drag starting on empty board space draws a selection rectangle;
   any piece whose on-screen CENTER falls inside it when released gets
   selected (added to the existing selection if shift was held at the
   start, otherwise replacing it) — then arrow keys / rotate / flip work
   on the whole group exactly as with a shift-click-built selection.
═══════════════════════════════════════════════ */
let marquee = null; // {startX, startY, additive, moved}
const marqueeBoxEl = document.getElementById('marquee-box');

boardEl.addEventListener('pointerdown', e=>{
  if(!e.target.classList.contains('board-cell')) return;
  if(isLocked()){ showBlockedMessage(); return; }
  e.preventDefault();
  marquee = { startX: e.clientX, startY: e.clientY, additive: e.shiftKey, moved: false };
  marqueeBoxEl.style.left = e.clientX + 'px';
  marqueeBoxEl.style.top = e.clientY + 'px';
  marqueeBoxEl.style.width = '0px';
  marqueeBoxEl.style.height = '0px';
  marqueeBoxEl.style.display = 'block';
  window.addEventListener('pointermove', onMarqueeMove);
  window.addEventListener('pointerup', onMarqueeEnd);
});

function onMarqueeMove(e){
  if(!marquee) return;
  if(Math.abs(e.clientX-marquee.startX)>3 || Math.abs(e.clientY-marquee.startY)>3) marquee.moved = true;
  const x0 = Math.min(marquee.startX, e.clientX), x1 = Math.max(marquee.startX, e.clientX);
  const y0 = Math.min(marquee.startY, e.clientY), y1 = Math.max(marquee.startY, e.clientY);
  marqueeBoxEl.style.left = x0 + 'px';
  marqueeBoxEl.style.top = y0 + 'px';
  marqueeBoxEl.style.width = (x1-x0) + 'px';
  marqueeBoxEl.style.height = (y1-y0) + 'px';
}

function onMarqueeEnd(e){
  window.removeEventListener('pointermove', onMarqueeMove);
  window.removeEventListener('pointerup', onMarqueeEnd);
  if(!marquee) return;
  marqueeBoxEl.style.display = 'none';

  if(!marquee.moved){
    // A plain click on empty space (no real drag) — the old simple
    // deselect-on-empty-click behavior. Shift+click on empty space stays
    // a no-op, same as before.
    if(!marquee.additive) deselect();
    marquee = null;
    return;
  }

  const x0 = Math.min(marquee.startX, e.clientX), x1 = Math.max(marquee.startX, e.clientX);
  const y0 = Math.min(marquee.startY, e.clientY), y1 = Math.max(marquee.startY, e.clientY);
  const additive = marquee.additive;
  marquee = null;

  const hitIds = [];
  placedPieces.forEach(p=>{
    const wrapEl = piecesLayerEl.querySelector(`[data-id="${p.id}"]`);
    if(!wrapEl) return;
    const r = wrapEl.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    if(cx>=x0 && cx<=x1 && cy>=y0 && cy<=y1) hitIds.push(p.id);
  });
  if(!additive) selectedIds.clear();
  hitIds.forEach(id=>selectedIds.add(id));
  renderAll();
}

/* ═══════════════════════════════════════════════
   GRID SIZE / CLEAR BOARD
═══════════════════════════════════════════════ */
function piecesFitInBounds(pieces, minR, maxR, minC, maxC){
  // Only checks each piece against the proposed outer bounds — overlap
  // *between* pieces is a separate, already-allowed concern (shown with
  // the red invalid tint), not a reason to block a resize.
  return pieces.every(p => p.cells.every(([r,c]) => {
    const rr = p.anchorRow+r, cc = p.anchorCol+c;
    return rr>=minR && rr<=maxR && cc>=minC && cc<=maxC;
  }));
}

const gridSizeInputEl = document.getElementById('grid-size-input');
const gridSizeErrorEl = document.getElementById('grid-size-error');

function gridSizeErrorActive(){ return gridSizeErrorEl.style.display !== 'none'; }
function showGridSizeError(msg){
  document.getElementById('grid-size-error-text').textContent = msg;
  gridSizeErrorEl.style.display = 'flex';
}
function clearGridSizeError(){
  gridSizeErrorEl.style.display = 'none';
  document.getElementById('grid-size-error-text').textContent = '';
}
// "Undo" for a rejected edit: drop the error and snap the input back to
// whatever the grid's actual current size is, ready for another attempt.
function dismissGridSizeError(){
  clearGridSizeError();
  gridSizeInputEl.value = Math.max(gridRows(), gridCols());
}

// No more Apply button — any way the number changes (typing + blur/Enter,
// arrow keys while focused, or the input's native spinner arrows) attempts
// the resize immediately via this one handler.
function attemptGridResize(){
  if(infiniteGrid) return; // input is disabled in this mode anyway
  const raw = gridSizeInputEl.value.trim();
  const n = Number(raw);
  if(raw === '' || !Number.isInteger(n) || n < 4 || n > 20){
    showGridSizeError('Enter a whole number between 4 and 20.');
    return;
  }
  if(placedPieces.length && !piecesFitInBounds(placedPieces, 0, n-1, 0, n-1)){
    showGridSizeError('Grid size too small for current piece arrangement.');
    return;
  }
  clearGridSizeError();
  if(n === gridRows() && n === gridCols()) return; // already this size, nothing to do

  // Existing pieces are preserved — resizing only changes the grid's outer
  // bounds, it doesn't touch placedPieces at all.
  pushUndo();
  gridMinRow = 0; gridMaxRow = n-1; gridMinCol = 0; gridMaxCol = n-1;
  saveGridBounds();
  setupBoard();
  placedPieces.forEach(p=>updatePendingPlacement(p.id));
  renderAll();
}

gridSizeInputEl.addEventListener('change', attemptGridResize);
gridSizeInputEl.addEventListener('keydown', e=>{
  if(e.key !== 'Enter') return;
  e.preventDefault();
  // Enter means two different things depending on context, so it never
  // fights with itself: dismiss a showing error, or otherwise commit.
  if(gridSizeErrorActive()){ dismissGridSizeError(); return; }
  attemptGridResize();
  // Only blur on success ("confirm and move on"). If that attempt just
  // raised a new error, the input must stay focused — otherwise a
  // follow-up Enter press (meant to dismiss it) would land nowhere.
  if(!gridSizeErrorActive()) gridSizeInputEl.blur();
});
document.getElementById('grid-error-accept').addEventListener('click', dismissGridSizeError);

document.getElementById('clear-board-btn').addEventListener('click', ()=>{
  if(!placedPieces.length) return;
  if(!confirm('Clear all pieces from the board?')) return;
  pushUndo();
  placedPieces = [];
  selectedIds.clear(); pendingPlacementIds.clear();
  maybeContractGrid();
  renderAll();
});

document.getElementById('infinite-grid-toggle').addEventListener('change', function(){
  infiniteGrid = this.checked;
  localStorage.setItem('poly_infiniteGrid', infiniteGrid);
  document.getElementById('grid-size-input').disabled = infiniteGrid;
  clearGridSizeError();
  if(infiniteGrid) maybeContractGrid();
  else document.getElementById('grid-size-input').value = Math.max(gridRows(), gridCols());
});

document.getElementById('checkerboard-toggle').addEventListener('change', function(){
  checkerboardEnabled = this.checked;
  localStorage.setItem('poly_checkerboard', checkerboardEnabled);
  const onionToggle = document.getElementById('onion-skin-toggle');
  onionToggle.disabled = !checkerboardEnabled;
  if(!checkerboardEnabled){
    onionSkinEnabled = false;
    onionToggle.checked = false;
    localStorage.setItem('poly_onionSkin', false);
  }
  setupBoard();
});
document.getElementById('onion-skin-toggle').addEventListener('change', function(){
  onionSkinEnabled = this.checked && checkerboardEnabled;
  localStorage.setItem('poly_onionSkin', onionSkinEnabled);
  renderCheckerOverlay();
});

/* ═══════════════════════════════════════════════
   TRAY ORIENTATION CONTROLS
═══════════════════════════════════════════════ */
function refreshTrayPreviews(){
  renderStandardTiles();
  renderPentominoTiles();
  renderCustomTiles();
}
document.getElementById('tray-rotate-btn').addEventListener('click', ()=>{
  trayRotation = (trayRotation + 90) % 360;
  document.getElementById('tray-rotate-btn').innerHTML = '&#10227; ' + trayRotation + '&deg;';
  refreshTrayPreviews();
});
document.getElementById('tray-flip-btn').addEventListener('click', ()=>{
  trayFlipped = !trayFlipped;
  document.getElementById('tray-flip-btn').classList.toggle('active', trayFlipped);
  refreshTrayPreviews();
});

/* ═══════════════════════════════════════════════
   CUSTOM PIECE EDITOR
═══════════════════════════════════════════════ */
let editorGrid = [];
let editorColor = MUTED_PINK;
let editingId = null;

function emptyEditorGrid(){
  return Array.from({length:EDITOR_SIZE},()=>Array(EDITOR_SIZE).fill(false));
}

function buildEditorGridDOM(){
  const g = document.getElementById('editor-grid');
  g.innerHTML = '';
  g.style.gridTemplateColumns = `repeat(${EDITOR_SIZE}, ${CELL_E}px)`;
  g.style.gridTemplateRows = `repeat(${EDITOR_SIZE}, ${CELL_E}px)`;
  for(let r=0;r<EDITOR_SIZE;r++){
    for(let c=0;c<EDITOR_SIZE;c++){
      const cell = document.createElement('div');
      cell.className = 'editor-cell';
      cell.dataset.r = r;
      cell.dataset.c = c;
      cell.addEventListener('pointerdown', e=>{
        e.preventDefault();
        editorGrid[r][c] = !editorGrid[r][c];
        syncEditorUI();
      });
      cell.addEventListener('pointerenter', e=>{
        if(e.buttons===1 && !editorGrid[r][c]){
          editorGrid[r][c] = true;
          syncEditorUI();
        }
      });
      g.appendChild(cell);
    }
  }
}

function syncEditorUI(){
  document.querySelectorAll('.editor-cell').forEach(el=>{
    const r=+el.dataset.r, c=+el.dataset.c;
    el.style.background = editorGrid[r][c] ? editorColor : '';
  });
}

function buildEditorColors(){
  const row = document.getElementById('editor-colors');
  row.innerHTML = '';
  PALETTE_COLORS.forEach(col=>{
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (col===editorColor ? ' active' : '');
    sw.style.background = col;
    sw.onclick = ()=>{ editorColor = col; buildEditorColors(); syncEditorUI(); };
    row.appendChild(sw);
  });
  const custom = document.createElement('input');
  custom.type = 'color';
  custom.className = 'color-custom-input';
  custom.value = editorColor;
  custom.oninput = ()=>{ editorColor = custom.value; buildEditorColors(); syncEditorUI(); };
  row.appendChild(custom);
}

function loadPieceIntoEditor(def){
  editorGrid = emptyEditorGrid();
  const offset = Math.floor(EDITOR_SIZE/2) - 2;
  def.cells.forEach(([r,c])=>{
    const rr = r+offset, cc = c+offset;
    if(rr>=0 && rr<EDITOR_SIZE && cc>=0 && cc<EDITOR_SIZE) editorGrid[rr][cc] = true;
  });
  editorColor = def.color;
}

function extractEditorCells(){
  const cells = [];
  for(let r=0;r<EDITOR_SIZE;r++)
    for(let c=0;c<EDITOR_SIZE;c++)
      if(editorGrid[r][c]) cells.push([r,c]);
  if(!cells.length) return null;
  return normalize(cells);
}

function openEditor(id){
  editingId = id;
  const def = customPieces.find(p=>p.id===id);
  buildEditorGridDOM();
  loadPieceIntoEditor(def);
  syncEditorUI();
  buildEditorColors();
  document.getElementById('editor-name').value = def.name;
  document.getElementById('editor-modal').classList.remove('hidden');
}

function closeEditor(){
  document.getElementById('editor-modal').classList.add('hidden');
  editingId = null;
}

document.getElementById('editor-cancel').addEventListener('click', closeEditor);
document.getElementById('editor-clear').addEventListener('click', ()=>{
  editorGrid = emptyEditorGrid();
  syncEditorUI();
});
document.getElementById('editor-rotate').addEventListener('click', ()=>{
  const cells = extractEditorCells();
  if(!cells) return;
  const rotated = rotateCells(cells);
  editorGrid = emptyEditorGrid();
  const offset = Math.floor(EDITOR_SIZE/2) - 2;
  rotated.forEach(([r,c])=>{
    const rr=r+offset, cc=c+offset;
    if(rr>=0 && rr<EDITOR_SIZE && cc>=0 && cc<EDITOR_SIZE) editorGrid[rr][cc]=true;
  });
  syncEditorUI();
});
document.getElementById('editor-flip').addEventListener('click', ()=>{
  const cells = extractEditorCells();
  if(!cells) return;
  const flipped = flipCells(cells);
  editorGrid = emptyEditorGrid();
  const offset = Math.floor(EDITOR_SIZE/2) - 2;
  flipped.forEach(([r,c])=>{
    const rr=r+offset, cc=c+offset;
    if(rr>=0 && rr<EDITOR_SIZE && cc>=0 && cc<EDITOR_SIZE) editorGrid[rr][cc]=true;
  });
  syncEditorUI();
});
document.getElementById('editor-save').addEventListener('click', ()=>{
  const cells = extractEditorCells();
  if(!cells){ alert('Draw at least one cell first!'); return; }
  const def = customPieces.find(p=>p.id===editingId);
  def.cells = cells;
  def.color = editorColor;
  def.edited = true;
  const name = document.getElementById('editor-name').value.trim();
  if(name) def.name = name;
  saveCustomPieces();
  renderCustomTiles();
  closeEditor();
});

/* ═══════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════ */
document.getElementById('grid-size-input').value = Math.max(gridRows(), gridCols());
document.getElementById('infinite-grid-toggle').checked = infiniteGrid;
document.getElementById('checkerboard-toggle').checked = checkerboardEnabled;
document.getElementById('onion-skin-toggle').checked = onionSkinEnabled;
document.getElementById('onion-skin-toggle').disabled = !checkerboardEnabled;
document.getElementById('grid-size-input').disabled = infiniteGrid;
setupBoard();
renderStandardTiles();
renderPentominoTiles();
renderCustomTiles();
renderAll();

window.addEventListener('resize', updateSelToolbar);
window.addEventListener('scroll', updateSelToolbar);
</script>
